<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>单题 AI 批改 - AI数智作业平台</title>
    <link rel="stylesheet" href="./styles.css?v=20261030-tools" />
    <link rel="stylesheet" href="./shell.css?v=20261030-tools" />
    <link rel="stylesheet" href="./ai-grading.css?v=20261030-tools" />
    <script src="./auth.js"></script>
    <script>window.AppAuth.requireAuth();</script>
  </head>
  <body>
    <main class="console-shell ai-grade-shell" aria-labelledby="ai-grade-title">
      <header class="console-topbar">
        <a class="back-link" href="./teacher.html" aria-label="返回控制台">
          <span class="back-link-text">控制台</span>
        </a>

        <a class="console-brand" href="./teacher.html" aria-label="返回教师控制台">
          <span class="logo-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M4.5 5.5h5.3c1 0 1.8.4 2.2 1.1.4-.7 1.2-1.1 2.2-1.1h5.3v12.2h-5.4c-.9 0-1.6.2-2.1.8-.5-.6-1.2-.8-2.1-.8H4.5V5.5Z" />
              <path d="M7.2 9.3h3.2M7.2 12.5h3.2M13.6 9.3h3.2M13.6 12.5h3.2" />
            </svg>
          </span>
          <span>AI数智作业平台</span>
        </a>

        <div class="topbar-actions">
          <div class="topbar-actions-mount" data-topbar-actions></div>
        </div>
      </header>

      <section class="ai-grade-main">
        <div class="ai-grade-heading">
          <p class="console-kicker">AI 工具</p>
          <h1 id="ai-grade-title">单题 AI 批改</h1>
          <p>上传一道试题和该生作答，AI 给出评分、扣分点与改进建议，结果自动保存到批改历史。</p>
        </div>

        <div class="ai-grade-layout">
          <article class="ai-grade-card">
            <header>
              <h2>试题与作答</h2>
              <p>建议拍摄清晰、光线均匀，题干与作答完整入镜。</p>
            </header>

            <div class="ai-grade-uploads">
              <label class="upload-tile compact-upload" for="aiQuestionUpload">
                <input id="aiQuestionUpload" type="file" accept="image/*" />
                <span class="upload-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" role="img">
                    <path d="M5.5 4.5h13v15h-13v-15Z" />
                    <path d="M8.5 8h7M8.5 11.5h5.5M8.5 15h3.5" />
                  </svg>
                </span>
                <span>
                  <strong>上传试题</strong>
                  <small id="aiQuestionFileName">支持 PNG、JPG</small>
                </span>
              </label>

              <label class="upload-tile compact-upload" for="aiAnswerUpload">
                <input id="aiAnswerUpload" type="file" accept="image/*" capture="environment" />
                <span class="upload-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" role="img">
                    <path d="M6 4.5h9l3 3v12H6v-15Z" />
                    <path d="M15 4.5v3h3M9 11h6M9 14.5h6M9 18h3" />
                  </svg>
                </span>
                <span>
                  <strong>上传学生作答</strong>
                  <small id="aiAnswerFileName">支持 PNG、JPG</small>
                </span>
              </label>
            </div>

            <div class="ai-grade-previews">
              <div class="selected-preview" id="aiQuestionPreview">
                <p class="empty-text">尚未选择题图</p>
              </div>
              <div class="selected-preview" id="aiAnswerPreview">
                <p class="empty-text">尚未选择作答图</p>
              </div>
            </div>

            <div class="ai-grade-settings">
              <label class="field-control">
                <span>满分</span>
                <input id="aiMaxScore" type="number" min="0.5" step="0.5" value="10" />
              </label>
              <label class="field-control">
                <span>评分标准（可选）</span>
                <textarea
                  id="aiRubric"
                  rows="3"
                  placeholder="例如：步骤完整 4 分，关键结论 4 分，书写规范 2 分。"
                ></textarea>
              </label>
            </div>

            <div class="ai-grade-actions">
              <button class="primary-button" id="aiGradeButton" type="button" disabled>开始 AI 批改</button>
              <span class="ai-grade-status" id="aiGradeStatus" role="status">请上传试题与学生作答</span>
            </div>
          </article>

          <section class="ai-grade-result" id="aiGradeResult" aria-live="polite">
            <p class="empty-text">批改后这里会显示 AI 评分与点评。</p>
          </section>
        </div>
      </section>
    </main>

    <script src="./shell.js?v=20261029-auth"></script>
    <script src="./ai-grading.js?v=20261030-tools"></script>
  </body>
</html>
