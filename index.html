<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI数智作业平台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell" aria-labelledby="page-title">
      <section class="brand-panel">
        <div class="brand-mark" aria-label="AI数智作业平台">
          <span class="logo-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M4.5 5.5h5.3c1 0 1.8.4 2.2 1.1.4-.7 1.2-1.1 2.2-1.1h5.3v12.2h-5.4c-.9 0-1.6.2-2.1.8-.5-.6-1.2-.8-2.1-.8H4.5V5.5Z" />
              <path d="M7.2 9.3h3.2M7.2 12.5h3.2M13.6 9.3h3.2M13.6 12.5h3.2" />
            </svg>
          </span>
          <span>AI数智作业平台</span>
        </div>

        <div class="hero-copy">
          <h1 id="page-title">让学习更高效，<br />让成长更简单</h1>
          <p>专为师生打造的现代化智慧教学空间</p>
        </div>
      </section>

      <section class="login-card" aria-label="教师工作台入口">
        <header>
          <h2>教师工作台</h2>
          <p>进入教学管理与批改工作台</p>
        </header>

        <div class="role-list">
          <button class="role-option is-active" type="button" data-role="teacher">
            <span class="icon-box" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M4.5 5.5h5.3c1 0 1.8.4 2.2 1.1.4-.7 1.2-1.1 2.2-1.1h5.3v12.2h-5.4c-.9 0-1.6.2-2.1.8-.5-.6-1.2-.8-2.1-.8H4.5V5.5Z" />
                <path d="M7.3 9.4h2.9M7.3 12.3h2.9M13.8 9.4h2.9M13.8 12.3h2.9" />
              </svg>
            </span>
            <span class="role-copy">
              <strong>教师</strong>
              <span>进入教学管理与批改工作台</span>
            </span>
            <span class="arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M5 12h13M13 6l6 6-6 6" />
              </svg>
            </span>
          </button>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
