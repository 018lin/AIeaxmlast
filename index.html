<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教师登录 - AI数智作业平台</title>
    <link rel="stylesheet" href="./styles.css?v=20261029-topbar" />
    <link rel="stylesheet" href="./shell.css?v=20261029-topbar" />
    <link rel="stylesheet" href="./theme.css?v=20261112-theme" />
    <script src="./auth.js?v=20261109-tenant"></script>
  </head>
  <body>
    <main class="page-shell login-shell" aria-labelledby="page-title">
      <div class="login-stack">
        <div class="login-brand" aria-label="AI数智作业平台">
          <span class="logo-box" aria-hidden="true">批</span>
          <span>AI数智作业平台</span>
        </div>

        <section class="login-card login-card-auth" aria-label="教师登录">
          <header>
            <h1 id="page-title">教师登录</h1>
            <p>请输入教师账号与密码后进入控制台</p>
          </header>

          <form class="login-form" id="loginForm" novalidate>
            <label class="login-field">
              <span>教师账号</span>
              <input
                name="account"
                type="text"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                autocomplete="username"
                placeholder="请输入教师账号"
                required
              />
            </label>

            <label class="login-field">
              <span>登录密码</span>
              <span class="password-wrap">
                <input
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="请输入登录密码"
                  required
                />
                <button class="password-toggle" id="passwordToggle" type="button" aria-label="显示密码">显示</button>
              </span>
            </label>

            <p class="login-error" id="loginError" role="alert" hidden></p>

            <button class="login-submit" type="submit">
              <span>进入教师控制台</span>
            </button>
          </form>
        </section>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
