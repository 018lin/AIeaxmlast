<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI数智作业平台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell" aria-labelledby="page-title">
      <section class="brand-panel">
        <div class="brand-mark" aria-label="AI数智作业平台">
          <span class="logo-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M4.5 5.5h5.3c1 0 1.8.4 2.2 1.1.4-.7 1.2-1.1 2.2-1.1h5.3v12.2h-5.4c-.9 0-1.6.2-2.1.8-.5-.6-1.2-.8-2.1-.8H4.5V5.5Z" />
              <path d="M7.2 9.3h3.2M7.2 12.5h3.2M13.6 9.3h3.2M13.6 12.5h3.2" />
            </svg>
          </span>
          <span>AI数智作业平台</span>
        </div>

        <div class="hero-copy">
          <h1 id="page-title">让学习更高效，<br />让成长更简单</h1>
          <p>专为师生打造的现代化智慧教学空间</p>
        </div>
      </section>

      <section class="login-card" aria-label="登录身份选择">
        <header>
          <h2>请选择登录身份</h2>
          <p>选择对应入口后继续登录</p>
        </header>

        <div class="role-list">
          <button class="role-option is-active" type="button" data-role="student">
            <span class="icon-box" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <circle cx="12" cy="8" r="3.6" />
                <path d="M5.8 19.2c.6-3.2 3-5.2 6.2-5.2s5.6 2 6.2 5.2" />
              </svg>
            </span>
            <span class="role-copy">
              <strong>学生</strong>
              <span>查看作业、错题与学习报告</span>
            </span>
            <span class="arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M5 12h13M13 6l6 6-6 6" />
              </svg>
            </span>
          </button>

          <button class="role-option is-disabled" type="button" disabled>
            <span class="icon-box" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <circle cx="9" cy="9" r="3" />
                <path d="M3.8 19c.5-2.9 2.4-4.7 5.2-4.7 1 0 1.9.2 2.7.7" />
                <circle cx="15.5" cy="11" r="2.6" />
                <path d="M11.2 19.1c.5-2.4 2.1-3.9 4.3-3.9 2.3 0 3.9 1.5 4.4 3.9" />
              </svg>
            </span>
            <span class="role-copy">
              <strong>家长</strong>
              <span>关注孩子学习进展</span>
            </span>
            <span class="status-pill">暂未开放</span>
          </button>

          <button class="role-option" type="button" data-role="teacher">
            <span class="icon-box" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M4.5 5.5h5.3c1 0 1.8.4 2.2 1.1.4-.7 1.2-1.1 2.2-1.1h5.3v12.2h-5.4c-.9 0-1.6.2-2.1.8-.5-.6-1.2-.8-2.1-.8H4.5V5.5Z" />
                <path d="M7.3 9.4h2.9M7.3 12.3h2.9M13.8 9.4h2.9M13.8 12.3h2.9" />
              </svg>
            </span>
            <span class="role-copy">
              <strong>教师</strong>
              <span>进入教学管理与批改工作台</span>
            </span>
            <span class="arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M5 12h13M13 6l6 6-6 6" />
              </svg>
            </span>
          </button>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
