<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教师登录 - AI数智作业平台</title>
    <link rel="stylesheet" href="./styles.css?v=20261029-topbar" />
    <link rel="stylesheet" href="./shell.css?v=20261029-topbar" />
    <script src="./auth.js"></script>
  </head>
  <body>
    <main class="page-shell login-shell" aria-labelledby="page-title">
      <div class="login-stack">
        <div class="login-brand" aria-label="AI数智作业平台">
          <span class="logo-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M4.5 5.5h5.3c1 0 1.8.4 2.2 1.1.4-.7 1.2-1.1 2.2-1.1h5.3v12.2h-5.4c-.9 0-1.6.2-2.1.8-.5-.6-1.2-.8-2.1-.8H4.5V5.5Z" />
              <path d="M7.2 9.3h3.2M7.2 12.5h3.2M13.6 9.3h3.2M13.6 12.5h3.2" />
            </svg>
          </span>
          <span>AI数智作业平台</span>
        </div>

        <section class="login-card login-card-auth" aria-label="教师登录">
          <header>
            <h1 id="page-title">教师登录</h1>
            <p>请输入教师账号与密码后进入控制台</p>
          </header>

          <form class="login-form" id="loginForm" novalidate>
            <label class="login-field">
              <span>教师账号</span>
              <input
                name="account"
                type="text"
                inputmode="numeric"
                autocomplete="username"
                placeholder="请输入教师账号"
                required
              />
            </label>

            <label class="login-field">
              <span>登录密码</span>
              <span class="password-wrap">
                <input
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="请输入登录密码"
                  required
                />
                <button class="password-toggle" id="passwordToggle" type="button" aria-label="显示密码">显示</button>
              </span>
            </label>

            <p class="login-error" id="loginError" role="alert" hidden></p>

            <button class="login-submit" type="submit">
              <span>进入教师控制台</span>
            </button>
          </form>
        </section>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
