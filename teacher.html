<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教师控制台 - AI数智作业平台</title>
    <link rel="stylesheet" href="./styles.css?v=20261029-auth" />
    <link rel="stylesheet" href="./shell.css?v=20261029-auth" />
    <script src="./auth.js"></script>
    <script>window.AppAuth.requireAuth();</script>
  </head>
  <body>
    <main class="console-shell" aria-labelledby="console-title">
      <header class="console-topbar">
        <a class="console-brand" href="./teacher.html" aria-label="教师控制台首页">
          <span class="logo-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M4.5 5.5h5.3c1 0 1.8.4 2.2 1.1.4-.7 1.2-1.1 2.2-1.1h5.3v12.2h-5.4c-.9 0-1.6.2-2.1.8-.5-.6-1.2-.8-2.1-.8H4.5V5.5Z" />
              <path d="M7.2 9.3h3.2M7.2 12.5h3.2M13.6 9.3h3.2M13.6 12.5h3.2" />
            </svg>
          </span>
          <span>AI数智作业平台</span>
        </a>

        <div class="topbar-actions" data-topbar-actions></div>
      </header>

      <section class="console-hero">
        <div>
          <p class="console-kicker">教师控制台</p>
          <h1 id="console-title">请选择工作模块</h1>
          <p>从作业名单导入、逐生拍照批改到本次与历史学情分析，进入对应工作台。</p>
        </div>
      </section>

      <section class="module-grid" aria-label="教师功能模块">
        <a class="module-card module-card-primary" href="./homework.html" aria-label="进入作业批改与学情分析">
          <span class="module-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M7 3.8h7.3L19 8.5v11.7H7V3.8Z" />
              <path d="M14 3.8v5h5M9.5 13h5M9.5 16.8h3.2" />
              <path d="M4.8 7.2v13h9.4" />
              <path d="M15.2 16.7l1.5 1.5 3.1-3.4" />
            </svg>
          </span>
          <span class="module-copy">
            <strong>作业批改与学情分析</strong>
            <span>导入 Excel 学生名单，逐生拍照或扫描由 AI 逐题批改；支持单题即时批改，并自动生成本次与历史学情分析。</span>
          </span>
          <span class="module-action">
            进入
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h13M13 6l6 6-6 6" />
            </svg>
          </span>
        </a>

        <a class="module-card" href="./batch-grading.html" aria-label="进入批量阅卷 MVP">
          <span class="module-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M6 4.2h8.2L18 8v11.8H6V4.2Z" />
              <path d="M14.2 4.2V8H18M8.8 11.5h6.4M8.8 14.8h4.4M4.2 7.3v12.5h9.5" />
              <path d="M16.2 15.8l1.3 1.3 2.6-2.9" />
            </svg>
          </span>
          <span class="module-copy">
            <strong>批量阅卷 MVP</strong>
            <span>管理班级、学生、考试、模板和扫描批次，按题裁切并逐题调用 AI 批阅。</span>
          </span>
          <span class="module-action">
            进入
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h13M13 6l6 6-6 6" />
            </svg>
          </span>
        </a>
      </section>
    </main>

    <script src="./shell.js?v=20261029-auth"></script>
  </body>
</html>
