<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教师控制台 - AI数智作业平台</title>
    <link rel="stylesheet" href="./styles.css?v=20261109-console2" />
    <link rel="stylesheet" href="./shell.css?v=20261109-console" />
    <link rel="stylesheet" href="./theme.css?v=20261112-theme" />
    <script src="./auth.js?v=20261109-tenant"></script>
    <script>if (window.AppAuth.requireAuth()) window.location.replace('./desk.html');</script>
  </head>
  <body>
    <main class="console-shell console-shell-modules" aria-label="教师控制台">
      <header class="console-topbar">
        <a class="console-brand" href="./teacher.html" aria-label="教师控制台首页">
          <span class="logo-box" aria-hidden="true">批</span>
          <span>AI数智作业平台</span>
        </a>

        <div class="topbar-actions" data-topbar-actions></div>
      </header>

      <div class="console-modules-stack">
        <section class="module-grid" aria-label="教师功能模块">
          <a class="module-card module-card-primary" href="./homework.html" aria-label="进入作业批改与学情分析">
            <span class="module-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M6.8 3.8h7.4L18.5 8v11.4H6.8V3.8Z" />
                <path d="M14.2 3.8V8h4.3" />
                <path d="M9.6 9.6h3.2" />
                <path d="M9.6 17.2v-3.4M12.1 17.2v-5.6M14.6 17.2v-2.2" />
              </svg>
            </span>
            <span class="module-copy">
              <strong>作业批改与学情分析</strong>
              <small>整卷批改、逐题得分与班级学情看板</small>
            </span>
            <span class="module-action">
              进入
            </span>
          </a>

          <a class="module-card" href="./batch-grading.html" aria-label="进入批量阅卷">
            <span class="module-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M8.8 7.6V3.8h7.2l3 2.9v9.9h-3.2" />
                <path d="M5.2 7.6h7.4l2.8 2.8v9.8H5.2V7.6Z" />
                <path d="M12.6 7.6v2.8h2.8" />
                <path d="M7.8 13.2h4.8M7.8 16.2h3.2" />
              </svg>
            </span>
            <span class="module-copy">
              <strong>批量阅卷</strong>
              <small>导入多份答卷，批量出分汇总</small>
            </span>
            <span class="module-action">
              进入
            </span>
          </a>
        </section>

        <section class="module-tools" aria-label="AI 工具">
          <h2 class="module-tools-title">AI 工具</h2>
          <a class="tool-card" href="./ai-grading.html" aria-label="进入单题 AI 批改">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M5.5 4.5h13v15h-13v-15Z" />
                <path d="M8.5 8h7M8.5 11h4" />
                <path d="M13.2 16.2l2.6-2.6 3 3-2.6 2.6h-3v-3Z" />
              </svg>
            </span>
            <span class="tool-copy">
              <strong>单题 AI 批改</strong>
              <small>上传试题与作答，快速获取评分、扣分点与改进建议</small>
            </span>
            <span class="tool-action">进入</span>
          </a>
        </section>
      </div>
    </main>

    <script src="./shell.js?v=20261109-tenant"></script>
  </body>
</html>
